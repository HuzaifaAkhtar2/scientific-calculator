<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="calculator" aria-label="Scientific calculator">
      <div class="display-panel">
        <input
          id="display"
          type="text"
          placeholder="0"
          aria-label="Calculator display"
          readonly
        />
      </div>
      <div class="keypad">
        <button class="operator" data-action="clear">AC</button>
        <button class="operator" data-action="delete">DEL</button>
        <button class="operator" data-value="(">(</button>
        <button class="operator" data-value=")">)</button>
        <button class="operator" data-action="percent">%</button>
        <button class="function" data-function="sin">sin</button>
        <button class="function" data-function="cos">cos</button>
        <button class="function" data-function="tan">tan</button>
        <button class="function" data-function="log">log</button>
        <button class="function" data-function="ln">ln</button>
        <button class="function" data-function="sqrt">sqrt</button>
        <button class="function" data-action="square">x&sup2;</button>
        <button class="function" data-value="^">x<sup>y</sup></button>
        <button class="function" data-value="pi">&pi;</button>
        <button class="function" id="angle-mode" data-action="angle">
          DEG
        </button>
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">*</button>
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">-</button>
        <button class="operator" data-value="+">+</button>
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value=".">.</button>
        <button class="equalBtn" data-action="calculate">=</button>
        <button data-value="00">00</button>
        <button data-value="0">0</button>
        <button class="function" data-value="e">e</button>
        <button class="function" data-action="answer">Ans</button>
        <button class="function" data-action="reciprocal">1/x</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
